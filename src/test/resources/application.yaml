# Test-only key. Never use this configuration outside tests.
app:
  protection:
    rate-limit:
      enabled: false
  auth:
    secret-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    issuer: service-advertiser
    audience: service-advertiser-api
    access-lifetime: 15m
    refresh-lifetime: 7d

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  profiles:
    active: test
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  file:
    name: ''
