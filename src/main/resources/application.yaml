spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  profiles:
    default: development
  application:
    name: service-advertiser
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE_PERIOD:30s}
  datasource:
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      connection-init-sql: SET statement_timeout = ${DB_STATEMENT_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

server:
  shutdown: graceful
  forward-headers-strategy: none

app:
  protection:
    max-json-body-size: ${JSON_MAX_REQUEST_SIZE:64KB}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-ip:
        capacity: ${RATE_LIMIT_LOGIN_IP_CAPACITY:120}
        period: ${RATE_LIMIT_LOGIN_IP_PERIOD:1m}
      login-account-ip:
        capacity: ${RATE_LIMIT_LOGIN_ACCOUNT_IP_CAPACITY:5}
        period: ${RATE_LIMIT_LOGIN_ACCOUNT_IP_PERIOD:1m}
      register-ip:
        capacity: ${RATE_LIMIT_REGISTER_IP_CAPACITY:20}
        period: ${RATE_LIMIT_REGISTER_IP_PERIOD:10m}
      refresh-ip:
        capacity: ${RATE_LIMIT_REFRESH_IP_CAPACITY:120}
        period: ${RATE_LIMIT_REFRESH_IP_PERIOD:1m}
  pagination:
    default-size: ${PAGINATION_DEFAULT_SIZE:10}
    max-size: ${PAGINATION_MAX_SIZE:100}
    max-offset: ${PAGINATION_MAX_OFFSET:10000}
  categories:
    max-per-business: ${BUSINESS_MAX_CATEGORIES:3}
    max-per-item: ${ITEM_MAX_CATEGORIES:2}
  items:
    max-per-business: ${ITEMS_MAX_PER_BUSINESS:10}
  auth:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:service-advertiser}
    audience: ${JWT_AUDIENCE:service-advertiser-api}
    access-lifetime: ${JWT_ACCESS_LIFETIME:15m}
    refresh-lifetime: ${JWT_REFRESH_LIFETIME:7d}

# Document errors explicitly instead of applying every advice handler to every endpoint.
springdoc:
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  override-with-generic-response: false

logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/service-advertiser.json}
  structured:
    format:
      file: logstash
  pattern:
    level: '%5p [request_id=%X{request_id:-}] %kvp'
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
      clean-history-on-start: true
  level:
    # SQL error details can contain submitted values; the advice owns API diagnostics.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: 'OFF'
    org.hibernate.orm.jdbc.error: 'OFF'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
