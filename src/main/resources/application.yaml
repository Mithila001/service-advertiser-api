spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: service-advertiser
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/service_advertiser}
    username: ${SPRING_DATASOURCE_USERNAME:dev_user123}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_user123}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  pagination:
    default-size: ${PAGINATION_DEFAULT_SIZE:10}
    max-size: ${PAGINATION_MAX_SIZE:100}
    max-offset: ${PAGINATION_MAX_OFFSET:10000}
  categories:
    max-per-business: ${BUSINESS_MAX_CATEGORIES:3}
    max-per-item: ${ITEM_MAX_CATEGORIES:2}
  items:
    max-per-business: ${ITEMS_MAX_PER_BUSINESS:10}
  auth:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:service-advertiser}
    audience: ${JWT_AUDIENCE:service-advertiser-api}
    access-lifetime: ${JWT_ACCESS_LIFETIME:15m}
    refresh-lifetime: ${JWT_REFRESH_LIFETIME:7d}
