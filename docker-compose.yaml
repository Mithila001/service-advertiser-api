
name: service-advertiser

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    environment:
      POSTGRES_DB: service_advertiser
      POSTGRES_USER: dev_user123
      POSTGRES_PASSWORD: dev_user123

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
