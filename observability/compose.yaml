name: service-advertiser-observability

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.7.8
    command: [-config.file=/etc/loki/config.yaml, -config.expand-env=true]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    logging: *logging
    networks: [observability]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/sources.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/application.yaml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    logging: *logging
    networks: [observability, observability_access]
    depends_on: [loki]

    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  alloy:
    image: grafana/alloy:v1.20.1
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/source.alloy]
    volumes:
      - alloy_data:/var/lib/alloy/data
    restart: unless-stopped
    logging: *logging
    networks: [observability]
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - prometheus_data:/prometheus
    restart: unless-stopped
    logging: *logging
    networks: [observability]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  observability:
    internal: true
  observability_access: {}

volumes:
  loki_data:
  grafana_data:
  alloy_data:
  prometheus_data:
