name: Verify
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Version and release helper checks
        run: |
          python3 -m unittest discover -s infrastructure -p 'test_release.py'
          python3 infrastructure/check_version.py
      - name: Unit and PostgreSQL integration tests
        run: mvn -B test
      - name: Compose configuration checks
        run: python3 infrastructure/check.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-reports
          retention-days: 7
          path: target/surefire-reports/
